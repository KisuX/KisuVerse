<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>KisuVerse</title>
    <script type="text/javascript">
      // GitHub Pages has no server-side routing, so unknown paths land here.
      // Encode the intended path into a query string and redirect to index.html,
      // which restores it via history.replaceState before React Router mounts.
      var pathSegmentsToKeep = 1

      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      )
    </script>
  </head>
  <body></body>
</html>
